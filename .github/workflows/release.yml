# Automated releases: every push to main that bumps the version in
# package.json publishes to npm and creates a GitHub Release tagged
# v<version> — no manual step.
#
# Everything in one job, deliberately: a Release created with GITHUB_TOKEN
# does not trigger other workflows (GitHub's recursion guard), so publishing
# from a separate release-triggered workflow would never run on the
# automated path.
#
# One-time requirement: a secret named NPM_TOKEN (an Automation token from
# npmjs.com). A version that already exists on npm is simply skipped —
# ordinary pushes without a bump stay green.
name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating the Release and tag
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check if version is new
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "superdoc-macros@$VERSION" version >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already on npm — nothing to release."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is new — releasing."
          fi

      - if: steps.version.outputs.new == 'true'
        run: npm ci

      - if: steps.version.outputs.new == 'true'
        run: npm run typecheck

      - if: steps.version.outputs.new == 'true'
        run: npm test

      - if: steps.version.outputs.new == 'true'
        name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # After the publish, not before: if publishing fails, no Release is
      # left pointing at a version that does not exist on npm.
      - if: steps.version.outputs.new == 'true'
        name: Create GitHub Release
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}

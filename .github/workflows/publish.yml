# פרסום ל-npm בכל GitHub Release.
#
# דורש secret בשם NPM_TOKEN (טוקן מסוג Automation מ-npmjs.com):
#   Settings ▸ Secrets and variables ▸ Actions ▸ New repository secret
# או מהטרמינל:  gh secret set NPM_TOKEN
#
# תהליך שחרור: מעלים גרסה ב-package.json, דוחפים, ויוצרים Release עם תג
# (למשל v0.1.0) — ה-workflow בודק, בונה ומפרסם.
name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
